<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="240" height="240">
  <title>Eduport Infrastructure Team</title>
  <!-- Writer picture. For a new writer, copy this file and change the title, the label and the hue (degrees). -->
  <defs>
    <radialGradient id="g" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#ff6c20"/>
      <stop offset="1" stop-color="#e45a19"/>
    </radialGradient>
    <filter id="tint" color-interpolation-filters="sRGB"><feColorMatrix type="hueRotate" values="195"/></filter>
  </defs>
  <g filter="url(#tint)">
    <rect width="120" height="120" fill="url(#g)"/>
    <image href="data:image/png;base64," x="4" y="-10" width="112" height="112"/>
    <rect x="0" y="86" width="120" height="34" fill="url(#g)" opacity="0.9"/>
  </g>
  <text x="60" y="101" text-anchor="middle" dominant-baseline="middle" fill="#ffffff" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="2">INFRA</text>
</svg>
